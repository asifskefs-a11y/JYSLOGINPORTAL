<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Visitor Entry - JYS Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=3.4.9">
    <link rel="stylesheet" href="staff-ui.css?v=3.4.9">
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-[#F8F9FD] text-gray-800">
    <div class="app-container">
        <!-- VISITOR VIEW -->
        <section id="view-visitor" class="view-section active flex flex-col min-h-screen">
            <nav class="w-full flex items-center gap-5 p-6 bg-white shadow-sm border-b sticky top-0 z-50">
                <a href="index.html" class="section-back-btn-circle" style="text-decoration: none;">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <h2 id="visitor-portal-title" class="text-2xl font-black text-indigo-900 uppercase tracking-normal">Visitor Entry</h2>
            </nav>

            <div class="flex-1 p-5 flex flex-col items-center justify-center">
                <!-- PREMIUM VISITOR ENTRY AREA (v3.4.9) -->
                <div class="w-full max-w-lg visitor-glass-container shadow-2xl overflow-hidden p-3 sm:p-5">
                    <div id="v-signin-area">
                        <!-- HEADER -->
                        <div class="mb-8">
                            <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3 pb-4 border-b-2 border-indigo-100/60">
                                <div class="flex items-center gap-3">
                                    <div id="portal-icon-bg" class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-600 to-indigo-800 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                                        <i id="portal-icon" class="fa-solid fa-school text-white text-xl"></i>
                                    </div>
                                    <div>
                                        <p id="portal-subtitle" class="text-[9px] font-black text-emerald-500 uppercase tracking-[0.2em] flex items-center gap-2">
                                            <span class="inline-block w-1.5 h-1.5 bg-emerald-400 rounded-full animate-pulse"></span>
                                            Visitor Management
                                        </p>
                                        <h3 id="portal-main-title" class="text-2xl font-black text-indigo-900 uppercase tracking-normal">Entry Portal</h3>
                                    </div>
                                </div>
                                <div class="flex items-center gap-3 text-[10px] text-slate-400 font-bold bg-slate-50/80 px-4 py-2 rounded-xl border border-slate-100/50">
                                    <span id="v-live-clock" class="text-indigo-600">--:--</span>
                                </div>
                            </div>
                        </div>

                        <form id="visitor-form" class="space-y-6" onsubmit="event.preventDefault(); event.stopPropagation(); if(window.handleVisitorSignIn) window.handleVisitorSignIn(event); return false;">
                            <!-- ROW 1 -->
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1.5">
                                    <label class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-hashtag"></i> ID
                                    </label>
                                    <input type="text" id="v-id" readonly class="w-full px-4 py-3 bg-indigo-50/50 rounded-xl text-indigo-700 font-black text-sm border-2 border-indigo-100/60 shadow-inner">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-calendar"></i> Date
                                    </label>
                                    <input type="text" id="v-date" readonly class="w-full px-4 py-3 bg-indigo-50/50 rounded-xl text-indigo-700 font-bold text-sm border-2 border-indigo-100/60 shadow-inner">
                                </div>
                            </div>

                            <!-- INPUT FIELDS -->
                            <div class="space-y-4">
                                <!-- Contractor ID Field (Hidden by default) -->
                                <div id="contractor-id-field" class="space-y-1.5 hidden">
                                    <label class="visitor-label text-[10px] font-black text-emerald-600 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-solid fa-id-card"></i> Contractor ID / Badge No. *
                                    </label>
                                    <input type="text" id="contractorId" placeholder="Enter Badge Number" class="transfer-input-field !min-h-[58px] !text-base border-emerald-200">
                                </div>

                                <div class="space-y-1.5">
                                    <label id="name-label" class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-user"></i> Visitor Name
                                    </label>
                                    <input type="text" id="v-name" placeholder="Full Name" required class="transfer-input-field !min-h-[58px] !text-base border-slate-200">
                                </div>
                                <div class="space-y-1.5">
                                    <label class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-phone"></i> Contact No.
                                    </label>
                                    <input type="tel" id="v-mobile" placeholder="Mobile Number" required class="transfer-input-field !min-h-[58px] !text-base border-slate-200">
                                </div>
                                <div class="space-y-1.5">
                                    <label id="company-label" class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-building"></i> Organization
                                    </label>
                                    <input type="text" id="v-company" placeholder="Company Name" required class="transfer-input-field !min-h-[58px] !text-base border-slate-200">
                                </div>
                                <div class="space-y-1.5">
                                    <label id="purpose-label" class="visitor-label text-[10px] font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                        <i class="fa-regular fa-pen-to-square"></i> Reason
                                    </label>
                                    <textarea id="v-purpose" placeholder="Describe purpose of visit..." required class="transfer-input-field border-slate-200 h-32 p-5 rounded-2xl text-base resize-none"></textarea>
                                </div>
                            </div>

                            <!-- KEY HANDOVER -->
                            <div class="p-5 bg-indigo-50/50 rounded-2xl border-2 border-indigo-100/60 space-y-3">
                                <p class="text-[10px] font-black text-indigo-900 uppercase tracking-widest text-center">Security Key Handover</p>
                                <div class="flex gap-4">
                                    <button type="button" id="v-key-yes" onclick="window.toggleVisitorKey(true)" class="flex-1 py-4 bg-white border-2 border-indigo-200 rounded-xl text-[10px] font-black uppercase text-indigo-400 transition-all hover:bg-indigo-50">🔑 Key Given</button>
                                    <button type="button" id="v-key-no" onclick="window.toggleVisitorKey(false)" class="flex-1 py-4 bg-indigo-600 border-2 border-indigo-600 rounded-xl text-[10px] font-black uppercase text-white transition-all shadow-lg shadow-indigo-200">❌ No Key</button>
                                </div>
                                <input type="hidden" id="v-key-status" value="NO">
                            </div>

                            <!-- SIGNATURE -->
                            <div class="visitor-signature-group pt-2">
                                <label class="signature-label"><i class="fa-solid fa-user"></i> Visitor Signature Required *</label>
                                <div class="canvas-wrapper">
                                    <div class="sig-lock-overlay" onclick="event.preventDefault(); event.stopPropagation(); window.unlockCanvas(this)">
                                        <i class="fa-solid fa-lock text-3xl text-indigo-500 mb-2"></i>
                                        <span>Tap here to sign</span>
                                    </div>
                                    <canvas id="v-sig-pad" class="signature-canvas"></canvas>
                                </div>
                                <div class="signature-actions">
                                    <button type="button" onclick="window.clearSignaturePad('v-sig-pad')" class="sig-clear-btn">
                                        <i class="fa-regular fa-trash-can"></i> Clear Signature
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn-submit-transfer !py-6 !text-lg !rounded-[24px] !bg-gradient-to-r !from-indigo-600 !to-indigo-800 shadow-xl shadow-indigo-500/30">Confirm Entry</button>
                        </form>
                    </div>

                    <div id="v-signout-area" class="hidden text-center py-12 px-4">

                        <div class="w-28 h-24 bg-orange-100 text-orange-600 rounded-full mx-auto flex items-center justify-center mb-8 shadow-inner">
                            <i class="fa-solid fa-right-from-bracket text-4xl"></i>
                        </div>
                        <h3 class="text-3xl font-black text-indigo-900 mb-2">Active Entry</h3>
                        <p class="text-slate-500 mb-10 font-medium text-lg text-gray-800">Welcome, <span id="v-active-name" class="text-indigo-600 font-bold"></span></p>

                        <div class="bg-indigo-50/50 rounded-3xl p-8 mb-10 text-left border border-indigo-100 shadow-sm text-gray-800">
                            <div class="flex justify-between items-center mb-4 border-b border-indigo-100 pb-4">
                                <span class="text-[11px] font-black text-indigo-400 uppercase tracking-widest">Tracking Log:</span>
                                <span id="v-active-id" class="text-sm font-bold text-indigo-900 font-mono"></span>
                            </div>
                            <div class="flex justify-between items-center">
                                <span class="text-[11px] font-black text-indigo-400 uppercase tracking-widest">Arrival:</span>
                                <span id="v-active-timein" class="text-sm font-bold text-indigo-900"></span>
                            </div>
                        </div>
                        <button id="v-signout-btn" class="btn-submit-transfer !bg-orange-500 !shadow-orange-200 !py-6 !text-lg">Register Departure</button>
                    </div>
                </div>
            </div>

            <footer class="mt-auto py-10 text-center text-[10px] opacity-40 font-bold text-indigo-900 uppercase tracking-[0.3em]">
                &copy; 2026 JYS Visitor Control System
            </footer>
        </section>
    </div>

    <script>
        // Live Clock (v3.4.9)
        function updateLiveClock() {
            const el = document.getElementById('v-live-clock');
            if (!el) return;
            const now = new Date();
            el.textContent = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        window.toggleVisitorKey = function(isYes) {
            const yesBtn = document.getElementById('v-key-yes');
            const noBtn = document.getElementById('v-key-no');
            const input = document.getElementById('v-key-status');

            if (isYes) {
                yesBtn.className = "flex-1 py-4 bg-indigo-600 border-2 border-indigo-600 rounded-xl text-[10px] font-black uppercase text-white shadow-lg shadow-indigo-200";
                noBtn.className = "flex-1 py-4 bg-white border-2 border-indigo-200 rounded-xl text-[10px] font-black uppercase text-indigo-400";
                input.value = "YES";
            } else {
                noBtn.className = "flex-1 py-4 bg-indigo-600 border-2 border-indigo-600 rounded-xl text-[10px] font-black uppercase text-white shadow-lg shadow-indigo-200";
                yesBtn.className = "flex-1 py-4 bg-white border-2 border-indigo-200 rounded-xl text-[10px] font-black uppercase text-indigo-400";
                input.value = "NO";
            }
        };

        // --- NEW: DUAL MODE INITIALIZATION ---
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const mode = params.get('mode') || 'visitor';
            window.portalMode = mode;

            if (mode === 'contractor') {
                document.getElementById('visitor-portal-title').innerText = "CONTRACTOR MANAGEMENT ENTRY PORTAL";
                document.getElementById('portal-subtitle').innerText = "Contractor Management";
                document.getElementById('portal-main-title').innerText = "Service Portal";
                document.getElementById('portal-icon').className = "fa-solid fa-helmet-safety text-white text-xl";
                document.getElementById('portal-icon-bg').className = "w-12 h-12 rounded-2xl bg-gradient-to-br from-emerald-600 to-emerald-800 flex items-center justify-center shadow-lg shadow-emerald-500/20";

                document.getElementById('contractor-id-field').classList.remove('hidden');
                document.getElementById('contractorId').required = true;

                document.getElementById('name-label').innerHTML = '<i class="fa-regular fa-user"></i> Contractor Name';
                document.getElementById('v-name').placeholder = "Full Name";
                document.getElementById('company-label').innerHTML = '<i class="fa-regular fa-building"></i> Contractor Company';
                document.getElementById('purpose-label').innerHTML = '<i class="fa-regular fa-pen-to-square"></i> Work Description';
                document.getElementById('v-purpose').placeholder = "Describe work to be performed...";
            } else {
                document.getElementById('visitor-portal-title').innerText = "VISITOR MANAGEMENT ENTRY PORTAL";
            }
        });
    </script>

    <script type="module" src="firebase_config.js?v=4.0"></script>
    <script type="module" src="field_normalizer.js?v=4.0"></script>
    <script type="module" src="drive_module.js?v=4.0"></script>
    <script type="module" src="ui_module.js?v=4.0"></script>
    <script type="module" src="import_module.js?v=4.0"></script>
    <script type="module" src="export_module.js?v=4.0"></script>
    <script type="module" src="attendance_module.js?v=4.0"></script>
    <script type="module" src="tasks_module.js?v=4.0"></script>
    <script type="module" src="admin_module.js?v=4.0"></script>
    <script type="module" src="visitor_module.js?v=4.0"></script>
    <script type="module" src="init_module.js?v=4.0"></script>
    <!-- FORCED GLOBAL SPINNER & OVERRIDE -->
    <style>
        @keyframes logoPulseScale {
            0% { transform: scale(0.85); -webkit-transform: scale(0.85); opacity: 0.7; }
            50% { transform: scale(1.15); -webkit-transform: scale(1.15); opacity: 1; }
            100% { transform: scale(0.85); -webkit-transform: scale(0.85); opacity: 0.7; }
        }
        @-webkit-keyframes logoPulseScale {
            0% { -webkit-transform: scale(0.85); opacity: 0.7; }
            50% { -webkit-transform: scale(1.15); opacity: 1; }
            100% { -webkit-transform: scale(0.85); opacity: 0.7; }
        }
        .logo-pulse-anim {
            animation: logoPulseScale 1.2s ease-in-out infinite !important;
            -webkit-animation: logoPulseScale 1.2s ease-in-out infinite !important;
            will-change: transform, opacity;
        }
    </style>
    <div id="universal-logo-loader" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 99999999; flex-direction: column; align-items: center; justify-content: center;">
        <img src="schoollogo.png" class="logo-pulse-anim" style="width: 100px; height: 100px; object-fit: contain;" alt="Loading..." onerror="this.src='jys_Icon.png'">
        <p id="universal-loader-text" style="color: #ffffff; font-weight: bold; margin-top: 16px; font-family: sans-serif; letter-spacing: 1px; text-transform: uppercase;">Processing, please wait...</p>
    </div>

    <script>
        var spinnerTimeout = null;
        window.showGlobalSpinner = function(msg) {
            var el = document.getElementById('universal-logo-loader');
            var txt = document.getElementById('universal-loader-text');
            var img = el ? el.querySelector('img') : null;
            if (el) {
                if (txt && msg) txt.innerText = msg;
                el.style.display = 'flex';
                // Force Reflow to restart animation reliably
                if (img) { img.style.animation = 'none'; img.offsetHeight; img.style.animation = ''; }
                if (spinnerTimeout) clearTimeout(spinnerTimeout);
                spinnerTimeout = setTimeout(function() { window.hideGlobalSpinner(); }, 15000);
            }
        };
        window.hideGlobalSpinner = function() {
            var el = document.getElementById('universal-logo-loader');
            if (el) el.style.display = 'none';
            if (spinnerTimeout) clearTimeout(spinnerTimeout);
        };
        document.addEventListener('submit', function() { window.showGlobalSpinner("Saving Data..."); }, true);
    </script>
</body>
</html>
