<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>JYS - Jarn Yafoor School Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <link rel="manifest" href="manifest.json">
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "7ae3b343-98cb-4e23-b5ee-7820c58582c3",
          safari_web_id: "web.onesignal.auto.6433e8ca-4e50-482a-9e8c-8a8f152d113a",
          notifyButton: {
            enable: false,
          },
          allowLocalhostAsSecureOrigin: true,
          serviceWorkerPath: "OneSignalSDKWorker.js",
        });
      });
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-white">

    <!-- APP LAUNCH VIDEO OVERLAY (Local Asset Version) -->
    <div id="launchVideoOverlay" class="fixed inset-0 w-full h-full bg-black z-[999999] items-center justify-center transition-opacity duration-1000 hidden">
        <video id="appLaunchVideo" class="w-full h-full object-cover" autoplay muted playsinline webkit-playsinline disablePictureInPicture preload="auto" style="pointer-events: none;">
            <source src="launch_video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <button id="skipVideoBtn" class="absolute top-8 right-8 px-8 py-3 bg-black/40 backdrop-blur-md text-white border border-white/20 rounded-full font-bold text-[10px] uppercase tracking-widest hover:bg-black/60 transition-all z-[1000000] active:scale-95 shadow-2xl">Skip Intro</button>
    </div>

    <div class="app-container">
        <!-- LANDING VIEW -->
        <section id="view-landing" class="view-section active items-center justify-center p-4 flex-1">
            <div class="portal-container">
                <header class="text-center mb-12">
                    <div class="w-full flex items-center justify-center mb-6">
                        <div class="logo-circular-frame h-[240px] w-[240px] flex items-center justify-center">
                            <img src="schoollogo.png" class="w-full h-full object-contain" alt="JYS Logo">
                        </div>
                    </div>
                    <h1 class="text-3xl md:text-5xl font-black tracking-tight text-indigo-900 drop-shadow-md">Jern Yafoor School</h1>
                    <p class="text-lg md:text-xl mt-2 font-bold text-indigo-700 bg-white/30 backdrop-blur-sm inline-block px-4 py-1 rounded-full border border-white/50">JYS Login Portal</p>
                </header>

                <main class="portal-main-container flex flex-col md:flex-row items-center justify-center gap-6 mt-12 w-full max-w-4xl mx-auto">
                    <a href="visitor.html" class="portal-card flex flex-col items-center justify-center bg-slate-50 border border-slate-100 rounded-3xl p-8 transition-all duration-300 transform active:scale-95 hover:shadow-xl group text-center flex-1 min-w-[280px]" style="text-decoration: none;">
                        <div class="bg-indigo-600 p-5 rounded-full mb-4 group-hover:bg-indigo-500 transition-colors shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                            </svg>
                        </div>
                        <span class="text-2xl font-bold text-[#221851]">Visitor Entry</span>
                        <p class="text-sm mt-2 text-[#555555] font-medium">Register and track visitors</p>
                    </a>

                    <a href="staff-login.html" class="portal-card flex flex-col items-center justify-center bg-slate-50 border border-slate-100 rounded-3xl p-8 transition-all duration-300 transform active:scale-95 hover:shadow-xl group text-center flex-1 min-w-[280px]" style="text-decoration: none;">
                        <div class="bg-purple-600 p-5 rounded-full mb-4 group-hover:bg-purple-500 transition-colors shadow-lg">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <span class="text-2xl font-bold text-[#221851]">Staff Portal</span>
                        <p class="text-sm mt-2 text-[#555555] font-medium">Access staff features</p>
                    </a>
                </main>

                <a href="admin.html" class="mt-12 text-sm text-[#221851] font-black hover:opacity-80 underline tracking-widest uppercase" style="text-decoration: none;">Admin Dashboard</a>
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="mt-auto py-6 text-center text-[10px] opacity-40 w-full">
            &copy; 2026 Jarn Yafoor School Staff Management System
        </footer>
    </div>

    <!-- NOTIFICATION PERMISSION MODAL -->
    <div id="notification-modal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-[200] hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl overflow-hidden shadow-2xl p-8 text-center text-gray-800">
            <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full mx-auto flex items-center justify-center mb-6 animate-bounce">
                <i class="fa-solid fa-bell text-3xl"></i>
            </div>
            <h3 class="text-xl font-black text-indigo-900 mb-2 uppercase tracking-tight">Enable Alerts</h3>
            <p class="text-sm text-gray-500 mb-8 font-medium">Get real-time updates when tasks are completed or issues are raised.</p>
            <button onclick="window.requestNotificationPermission()" class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-black shadow-xl active:scale-95 transition uppercase tracking-widest">Enable Notifications Now</button>
            <button onclick="document.getElementById('notification-modal').classList.add('hidden')" class="mt-4 text-[10px] font-bold text-gray-400 uppercase underline">Maybe Later</button>
        </div>
    </div>

    <script type="module" src="firebase_config.js?v=2.1"></script>
    <script type="module" src="ui_module.js?v=2.1"></script>
    <script type="module" src="auth_module.js?v=2.1"></script>
    <script type="module" src="attendance_module.js?v=2.1"></script>
    <script type="module" src="task_module.js?v=2.1"></script>
    <script type="module" src="admin_module.js?v=2.1"></script>
    <script type="module" src="export_module.js?v=2.1"></script>
    <script type="module" src="visitor_module.js?v=2.1"></script>
    <script type="module" src="init_module.js?v=2.1"></script>
</body>
</html>
